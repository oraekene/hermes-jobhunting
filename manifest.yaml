# manifest.yaml — package manifest
#
# Formalises what the package already is rather than replacing it. The skill
# directories, the references/ progressive-disclosure pattern, the numbered SQL
# chain and the ADDENDUM layering all stay exactly as they are; this file names
# them so a build, an update and an addon purchase can be reasoned about.
#
# Validated by check_manifest.py against graph.json, gates.yaml, settings.yaml
# and flows.yaml.

package:
  id: job-hunting
  version: 1.0.0
  min_hermes: "0.9.0"          # pin; do not track main — see PACKAGING.md
  license: proprietary
  registries:
    gates: gates.yaml
    settings: settings.yaml
    flows: flows.yaml
    graph: graph.json           # regenerated by extract_graph.py, never hand-edited

# ═══════════════════════════════════════════════════════════════════════════
# CORE — ships with every licence, can never live in an addon
# ═══════════════════════════════════════════════════════════════════════════
core:
  rationale: >
    shared/ is referenced by 105 distinct sources, more than every skill
    combined. Anything with that fan-in is core by definition — an addon that
    could modify it would be an addon that could break every other addon.
  areas: [shared, security, cron, templates]
  skills:
    - {id: 00-orchestrator,          in_degree: 8}
    - {id: 01-job-discovery,         in_degree: 8}
    - {id: 02-jd-parser,             in_degree: 12}
    - {id: 03-resume-match,          in_degree: 5}
    - {id: 04-keyword-analysis,      in_degree: 5}
    - {id: 05-resume-customizer,     in_degree: 14}
    - {id: 06-cover-letter,          in_degree: 10}
    - {id: 07-context-architect,     in_degree: 20}   # most-depended-on skill in the package
    - {id: 08-application-qa,        in_degree: 10}
    - {id: 09-risk-tactics-gate,     in_degree: 14}
    - {id: 10-approval-and-submit,   in_degree: 15}
    - {id: 11-analytics-and-learning, in_degree: 13}
    - {id: 12-company-research,      in_degree: 8}
    - {id: 16-career-pulse,          in_degree: 11}
    - {id: 21-output-templates,      in_degree: 6}
    - {id: 18-skill-composer,        in_degree: 3, note: "development tool; consider Pro-only"}
    - {id: onboarding,               in_degree: 1}
    - {id: permissions,              in_degree: 0, note: "conversational permission packs; reads gates.yaml"}
  provides_capabilities:
    [job_discovery, jd_parsing, resume_tailoring, cover_letters, application_answers,
     evidence_gate, approval_and_submit, analytics, company_research, memory,
     career_journal, permission_management]

# ═══════════════════════════════════════════════════════════════════════════
# ADDONS
# ═══════════════════════════════════════════════════════════════════════════
addons:

- id: addon-interview
  name: Interview and Offer
  version: 1.0.0
  min_core: 1.0.0
  skills: [13-interview-prep]
  provides_capabilities: [interview_prep, offer_comparison]
  optional_capabilities: [cold_outreach, contact_enrichment]
  gates: []                       # fires core gates only
  flows: [FLOW-D1, FLOW-D2, FLOW-D3, FLOW-D4]
  migrations: []
  degradation:
    on_expiry: >
      Prep briefs, flashcard decks and interviewer research are retained and
      remain readable. New briefs stop being generated; the interview-invite
      cron stops firing. interview_request_at is still recorded by core, so
      nothing is lost and everything resumes on repurchase.
    data_retained: true
    data_readable: true

- id: addon-outreach
  name: Outreach and Prospecting
  version: 1.0.0
  min_core: 1.0.0
  skills: [14-social-discovery-outreach, 17-cold-prospecting, 22-contact-enrichment]
  provides_capabilities: [social_listening, cold_outreach, contact_enrichment, pitch_catalog]
  optional_capabilities: [interests_profile]
  gates: [GATE-SEND-DM, GATE-SEND-EMAIL, GATE-SEND-INMAIL, GATE-LINKEDIN-CONNECT,
          GATE-PUBLIC-REPLY, GATE-SOCIAL-POLL, GATE-ENRICHMENT-LOOKUP,
          GATE-PAID-SPEND, GATE-API-KEY-CONNECT, GATE-PITCH-CONFIRM, GATE-PITCH-WILDCARD]
  flows: [FLOW-C1, FLOW-C2, FLOW-C3, FLOW-C4, FLOW-C5, FLOW-C6]
  migrations: [14, 15, 19, 20]
  degradation:
    on_expiry: >
      Pitch catalog, contact records, outreach history and reply threads are
      retained and readable. No new messages are drafted or sent, listening
      crons stop, enrichment stops. Spending gates go dormant rather than
      permissive — an expired addon must never leave a send path open.
    data_retained: true
    data_readable: true
  note: >
    The heaviest addon by gate count. Eleven of the 38 gates live here,
    including five of the eleven irreversible-external ones. Its permission
    packs must install and uninstall atomically with it.

- id: addon-direction
  name: Career Direction
  version: 1.0.0
  min_core: 1.0.0
  skills: [19-career-path-planner, 20-interests-profile]
  provides_capabilities: [career_planning, interests_profile]
  optional_capabilities: [social_listening, cold_outreach, interview_prep]
  gates: [GATE-SENSITIVE-DISCLOSURE]
  flows: [FLOW-E1, FLOW-E2]
  migrations: [6, 16]
  degradation:
    on_expiry: >
      Saved plans and the interests profile are retained and readable. No new
      plans are generated. GATE-SENSITIVE-DISCLOSURE remains active for as long
      as any sensitive entry exists, whether or not the addon is licensed —
      a non-negotiable gate does not expire with a subscription.
    data_retained: true
    data_readable: true

- id: addon-presence
  name: Public Presence
  version: 1.0.0
  min_core: 1.0.0
  skills: [23-portfolio-onepager, 24-linkedin-profile-optimizer]
  provides_capabilities: [portfolio_page, profile_optimisation]
  optional_capabilities: [career_planning, cold_outreach]
  gates: [GATE-PORTFOLIO-PUBLISH, GATE-PROFILE-EDIT]
  flows: [FLOW-F1, FLOW-F2]
  migrations: [17, 18]
  degradation:
    on_expiry: >
      A published portfolio page stays published — it is on the user's own
      hosting and taking it down is not the vendor's decision. The manifest,
      artefact records and audit history are retained and readable. No new
      builds, no republishing, no link-rot checks.
    data_retained: true
    data_readable: true

# ═══════════════════════════════════════════════════════════════════════════
# CAPABILITY CONTRACTS
# ═══════════════════════════════════════════════════════════════════════════
# THE central packaging problem, measured: 19 references run from a core skill
# to a skill that would live in an addon, plus 5 cross-pack addon->addon
# references. Every one dangles when that addon is absent — and a dangling
# reference in a markdown skill does not error. It produces a skill that reads
# convincingly and silently does less, which is the same failure mode as a
# partial install (FLOW-H4).
#
# The fix is not to move skills around until the graph is clean; that would
# put interview prep in core because the orchestrator mentions it. The fix is
# that core never names an addon skill. It names a CAPABILITY, checks whether
# that capability is present, and has defined behaviour when it is not.

capability_contracts:
  rule: >
    A core skill may reference `capability:<name>`. It may never reference an
    addon skill id. Each contract below states what core does when the
    capability is absent, and that behaviour must be a real, useful path —
    never an error, never silence.

  contracts:
  - capability: interview_prep
    provided_by: addon-interview
    referenced_by: [00-orchestrator, 07-context-architect, 12-company-research]
    when_absent: >
      interview_request_at is still recorded and the outcome still counts in
      analytics. The user is told an interview was detected and that prep is
      available as an addon. No brief is generated and nothing breaks.

  - capability: social_listening
    provided_by: addon-outreach
    referenced_by: [01-job-discovery, 16-career-pulse, 18-skill-composer, 21-output-templates]
    when_absent: >
      Discovery runs on its configured sources only. `social_listening` is not
      offered as a source type and a configured one is skipped with a notice
      rather than failing validation.

  - capability: cold_outreach
    provided_by: addon-outreach
    referenced_by: [12-company-research, 16-career-pulse, 21-output-templates]
    when_absent: >
      Company research still runs and still caches — it has standalone value
      for applications and interviews. Nothing is drafted for sending.

  - capability: contact_enrichment
    provided_by: addon-outreach
    referenced_by: [16-career-pulse]
    when_absent: >
      No lookups run. Any flow needing a named person asks the user for it.

  - capability: career_planning
    provided_by: addon-direction
    referenced_by: [00-orchestrator, 07-context-architect, 10-approval-and-submit, 16-career-pulse]
    when_absent: >
      The target profile is still confirmed and edited normally. Multi-hop
      planning is unavailable; a single target role is not.

  - capability: interests_profile
    provided_by: addon-direction
    referenced_by: [05-resume-customizer, 07-context-architect, 09-risk-tactics-gate, 16-career-pulse]
    when_absent: >
      Resume and cover-letter generation proceed without the interests source.
      GATE-SENSITIVE-DISCLOSURE stays active regardless, because sensitive
      entries may already exist from a previous licence period.

  cross_pack:
    rule: >
      An addon may declare optional_capabilities on another addon, never a
      hard dependency. Five cross-pack references exist today
      (direction->interview, direction->outreach, interview->outreach,
      presence->direction, presence->outreach). All five must degrade, or
      buying one addon silently requires another.

# ═══════════════════════════════════════════════════════════════════════════
# MIGRATIONS
# ═══════════════════════════════════════════════════════════════════════════
migrations:
  chain: applications_db_schema.sql then addendum.sql then addendum_2 .. addendum_20
  next_number: 21
  version_table: schema_version
  version_table_created_in: addendum_7
  rule: >
    Every addon that adds tables takes the next number in the same chain. No
    parallel chains, no addon-local databases. A shared database with one
    ordered migration history is why an addon can add a table that core
    analytics can later read.
  self_recording: >
    Every migration from 8 to 20 ends by recording itself, and addendum_7
    backfills the base schema plus 1, 2, 4, 5 and 6 when it creates the ledger.
    _3 is deliberately excluded because it is superseded by _4 and asserting it
    would be a guess. The chain is in better shape than a first read suggests.
  residual_risk:
    problem: >
      The addendum_7 backfill ASSERTS rather than VERIFIES. It writes "these
      ran" without checking that their tables and columns actually exist, on
      the reasonable assumption that ordering discipline held.
    consequence: >
      An install interrupted mid-chain, or a restore from a partial backup,
      records a clean migration history over a database that is missing
      objects. Nothing detects it until an unrelated query fails weeks later.
    fix: >
      addendum_21 verifies rather than backfills: it checks every recorded
      migration's objects exist by name and writes a drift report. Assertion
      was right for a single-developer package; verification is what a shipped
      one needs, because you cannot inspect a customer's database.

# ═══════════════════════════════════════════════════════════════════════════
# ADDENDUM LAYERING
# ═══════════════════════════════════════════════════════════════════════════
# The update mechanism. An addon or update modifies core behaviour by shipping
# an ADDENDUM that layers over a host file at load time — never by editing the
# host file.
addendum_layering:
  precedence:            # later wins on conflict
    - core skill body
    - core addendum (shipped by a core update)
    - addon addendum, in addons[] declaration order
    - user override
  rules:
    - An addendum declares `host:` (the file it layers over) and `min_host_version:`.
    - An addendum may add sections and replace named sections. It may not delete
      a section another addendum depends on.
    - Two addenda replacing the same named section is a build error, not a
      last-one-wins silent resolution.
    - Addenda are applied at load, never merged into the host on disk.
  never_absorb:
    problem: >
      27 files under _merge-history/ are referenced by nothing live. They were
      absorbed into their host files during development, and their originals
      are now unreachable.
    consequence: >
      Absorption is fine for a single developer consolidating their own work.
      For a shipped addon it is fatal: once an addon's changes are folded into
      a core file, the next core update overwrites them and the customer's paid
      feature silently disappears.
    rule: SHIPPED ADDENDA ARE NEVER ABSORBED.
  build_excludes: [_merge-history/, ADDENDUM-CHANGELOG.md, AUDIT-TRIAGE.md,
                   hermes-capability-audit.md, MERGE-STATUS.md]

# ═══════════════════════════════════════════════════════════════════════════
# BUILD
# ═══════════════════════════════════════════════════════════════════════════
build:
  stages:
    - id: package
      description: >
        Collect the shippable tree. Exclusions happen here and nowhere else, and
        this is the stage that actually removes the most: 34 files, 276 KB, 18%
        of the package.
    - id: validate
      run: [extract_graph.py, check_gates.py, check_flows.py, check_manifest.py]
      fail_on: any
    - id: strip_rationale
      description: >
        MEASURED, and less valuable than first assumed. An audit of the real
        package found 16 candidate headings across 16 files — the design
        reasoning is woven inline rather than sitting in liftable sections, so
        a build cannot remove it without rewriting 137 files by hand. What
        actually delivers is the exclusion list below: 34 files, 276 KB, 18%
        of the package. Keep the <!--rationale--> markers for new writing;
        do not schedule a marking pass. See BUILD.md.
      removes: [sections marked <!--rationale-->, build_excludes above]
    - id: watermark
      description: >
        Per-licence invisible markers — whitespace patterns, comment ids, a
        per-seat salt in a config value. A leaked copy is traceable to the
        buyer. Against a few hundred users this deters sharing better than any
        obfuscation, because it is social rather than technical.
      applies_to: [".md", ".sql", ".txt"]
      note: >
        Deliberately NOT .yaml/.yml/.template — those become the user's live
        config and are rewritten within days, so the mark degrades into a wrong
        seat rather than no seat. And deliberately not .py, which the next stage
        compiles; a whitespace mark there is erased by the same build that
        applied it.
    - id: compile_scripts
      description: >
        Nuitka when available, byte-compilation as the portable fallback, and a
        loud skip when neither applies. Runs AFTER watermarking. Markdown must
        stay readable to the agent; scripts need not be.
      targets: ["**/*.py"]
    - id: sign
      description: >
        Detached signature over a manifest of per-file hashes, plus the
        ordering-encoded index that is the second watermark channel.
      outputs: [core bundle, one bundle per addon]
  delivery:
    description: >
      Skills are fetched at activation against a valid licence, not shipped in
      the installer. Nothing exists to forward before activation.
    licence_check: server-side, at ledger call time — never a client-side boolean
