# CLASS A — IRREVERSIBLE EXTERNAL  (11 gates)
# ═════════════════════════════════════════════════════════════════════════════
gates:

- id: GATE-SUBMIT-APPLICATION
  label: Submitting a job application
  class: irreversible_external
  pack: PACK-SENDING
  owner: 10-approval-and-submit/SKILL.md
  rule: Rule 1
  default: "on"
  toggleable: true
  arm_required: true
  expires_days: 30
  cap_applies: true
  enforcement:
    layers: 3
    detail:
      - skill's own Telegram approval message, reads the reply for intent
      - Hermes dangerous-command approval on the submit action
      - security/hooks/verify-submit-approval.py, reads approval_decision from the DB
    note: >
      Layer 3 fails CLOSED on every branch it can see and fails OPEN on any tool
      name not in WATCHED_TOOLS. If this gate is switched off, the hook needs an
      explicit signed bypass — never a wildcard allow, or the gate is gone for
      injected instructions too.
  panel:
    when_on: >
      A Product Manager role at Acme is filled in and ready. You get a message
      with the company, the role, a screenshot of the completed form and the
      list of claims made. Nothing is sent until you reply approve. If you say
      nothing, it waits.
    when_off: >
      The same application is submitted the moment it is built — typically
      within a minute of the posting being found. You find out it went out when
      it appears in your sent list. If a claim was wrong, it has already reached
      the employer.

- id: GATE-SEND-DM
  label: Sending a direct message
  class: irreversible_external
  pack: PACK-SENDING
  owner: 14-social-discovery-outreach/SKILL.md
  rule: Rule 6, Rule 12
  default: "on"
  toggleable: true
  arm_required: true
  expires_days: 30
  cap_applies: true
  enforcement: {layers: 2, detail: [per-message approval, send-tier check against the capability matrix]}
  panel:
    when_on: >
      A hiring manager posts that they are hiring. A message is drafted using
      your pitch catalog and shown to you with the post it responds to. You
      approve or edit it.
    when_off: >
      The message sends itself. On a platform where automated sending is
      against the rules, the account carrying that risk is yours, not the tool's.

- id: GATE-SEND-EMAIL
  label: Sending a cold email
  class: irreversible_external
  pack: PACK-SENDING
  owner: 17-cold-prospecting/SKILL.md
  rule: Rule 1, Rule 8
  default: "on"
  toggleable: true
  arm_required: true
  expires_days: 30
  cap_applies: true
  enforcement: {layers: 2, detail: [per-message approval, claims-evidence check under Rule 8]}
  panel:
    when_on: >
      A pitch to a company you have researched is drafted, with every claim
      about their situation traced to a line in the research record. You read it
      before it sends.
    when_off: >
      It sends on the research pass's own schedule. A wrong guess about a
      company's problems is now something you asserted to them in writing.

- id: GATE-SEND-INMAIL
  label: Spending an InMail credit
  class: irreversible_external
  pack: PACK-SENDING
  owner: 14-social-discovery-outreach/references/inmail-credits.md
  rule: Rule 14
  default: "on"
  toggleable: true
  arm_required: true
  expires_days: 30
  cap_applies: true
  enforcement: {layers: 2, detail: [per-message approval, credit-balance check]}
  panel:
    when_on: >
      You are told which of your monthly credits this would use and how many
      remain, before it goes. One InMail per recipient — there is no follow-up
      without a reply.
    when_off: >
      Credits are spent as targets are found. A month's allowance can be gone in
      a day, on recipients you never saw.

- id: GATE-LINKEDIN-CONNECT
  label: Sending a connection request
  class: irreversible_external
  pack: PACK-SENDING
  owner: 14-social-discovery-outreach/references/linkedin-connection-flow.md
  rule: Rule 13, Rule 14
  default: "on"
  toggleable: true
  arm_required: true
  expires_days: 30
  cap_applies: true
  enforcement: {layers: 2, detail: [per-request approval, human-paced execution on your own session]}
  panel:
    when_on: >
      Each request is shown with the note attached, then sent at human pace on
      your own logged-in session.
    when_off: >
      Requests go out in batches. LinkedIn's pattern detection is looking for
      exactly this shape, and the account it acts against is yours.

- id: GATE-PUBLIC-REPLY
  label: Commenting publicly under your name
  class: irreversible_external
  pack: PACK-PUBLISHING
  owner: 14-social-discovery-outreach/SKILL.md
  rule: Rule 1
  default: "on"
  toggleable: true
  arm_required: true
  expires_days: 30
  cap_applies: true
  enforcement: {layers: 1, detail: [per-comment approval, labelled REPLY so it reads differently from a DM]}
  panel:
    when_on: >
      A reply to a public thread is drafted and marked as going up publicly,
      visible to everyone in that thread, before you approve it.
    when_off: >
      Comments post themselves under your name where colleagues and future
      employers can read them.

- id: GATE-PROFILE-EDIT
  label: Editing your live LinkedIn profile
  class: irreversible_external
  pack: PACK-PUBLISHING
  owner: 24-linkedin-profile-optimizer/SKILL.md
  rule: Rule 1
  default: "on"
  toggleable: true
  arm_required: true
  expires_days: 30
  cap_applies: false
  enforcement: {layers: 1, detail: [explicit approval per individual change]}
  panel:
    when_on: >
      Each headline, summary or role change is proposed one at a time with the
      current text beside the new one.
    when_off: >
      Your public profile is rewritten. Your network sees the edit activity, and
      so does your current employer.

- id: GATE-PORTFOLIO-PUBLISH
  label: Publishing your portfolio page
  class: irreversible_external
  pack: PACK-PUBLISHING
  owner: 23-portfolio-onepager/references/hosting-and-publish.md
  rule: Rule 1
  default: "on"
  toggleable: true
  arm_required: true
  expires_days: 30
  cap_applies: false
  enforcement: {layers: 1, detail: [confirm before the page goes to a public URL]}
  panel:
    when_on: >
      The page is built locally and you open it before deciding whether it goes
      to a public address.
    when_off: >
      It publishes on build. Anything drawn from memory that you would not have
      put on a public page is now on one.

- id: GATE-TESTIMONIAL-POST
  label: Posting your results publicly
  class: irreversible_external
  pack: PACK-PUBLISHING
  owner: (new — outcome-sharing feature)
  rule: Rule 1
  default: "on"
  toggleable: false
  arm_required: false
  expires_days: null
  cap_applies: false
  enforcement:
    layers: 2
    detail:
      - per-post approval
      - every figure traced to a database row before it can appear in the draft
  note: Deliberately not toggleable. Auto-posting someone's job-search statistics is not a convenience anyone wants.
  panel:
    when_on: >
      After your sixth interview invite, a short post is drafted in your own
      writing style with the underlying numbers shown beside it. You edit or
      discard it.
    when_off: not available — this gate cannot be switched off

- id: GATE-SENSITIVE-DISCLOSURE
  label: Using sensitive personal information in an outward document
  class: irreversible_external
  pack: PACK-PUBLISHING
  owner: 20-interests-profile/SKILL.md
  rule: Rule 10
  default: "on"
  toggleable: false
  arm_required: false
  expires_days: null
  cap_applies: false
  enforcement: {layers: 1, detail: [per-use confirmation at the point of use, separate from the confirmation that stored it]}
  note: >
    NON-NEGOTIABLE. Covers religion, health and disability, political and
    organising activity, and adjacent protected characteristics. Recording is
    free and unrestricted; disclosure is always a conscious per-use choice.
    Automating this would mean the tool outing someone to an employer.
  panel:
    when_on: >
      A cover letter would mention volunteer work with a religious organisation
      because it matches the employer's stated values. You are asked, for this
      one letter, whether to include it.
    when_off: not available — this gate cannot be switched off

- id: GATE-PAID-SPEND
  label: Spending real money on contact lookups
  class: irreversible_external
  pack: PACK-SPENDING
  owner: 22-contact-enrichment/SKILL.md
  rule: null
  default: "on"
  toggleable: true
  arm_required: true
  expires_days: 30
  cap_applies: true
  budget_field: tier3_monthly_budget_usd
  panel:
    when_on: >
      The free cascade runs first — public sources, self-hosted tools, then
      rotated free tiers, over 325 lookups a month before anything costs
      money. Only past that are you asked, with the price.
    when_off: >
      Paid lookups run automatically up to your monthly budget. Set the budget
      before switching this off; the default is zero, which means nothing spends.

