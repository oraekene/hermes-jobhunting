- id: GATE-PIPELINE-PAUSE
  label: Pausing and resuming the pipeline
  class: reversible_internal
  pack: PACK-PREFERENCES
  owner: 00-orchestrator/SKILL.md
  rule: Rule 15
  default: "on"
  toggleable: false
  arm_required: false
  expires_days: null
  note: While paused, discovery stops but conversation does not. Career-pulse keeps running.
  panel:
    when_on: Pausing and resuming are always your call, and a pause has a visible expiry.
