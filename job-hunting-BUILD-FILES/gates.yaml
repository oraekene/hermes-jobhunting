  panel:
    when_on: A stretch capability is confirmed separately, in its own conversation, and tagged wherever it is used.
    when_off: not available

- id: GATE-CALIBRATION-CHANGE
  label: Changing match-score thresholds
  class: reversible_internal
  pack: PACK-PREFERENCES
  owner: shared/dynamic-target-calibration.md
  rule: null
  default: "off"
  toggleable: true
  arm_required: false
  expires_days: null
  panel:
    when_on: You approve each threshold change.
    when_off: Thresholds adjust to what is actually landing responses. Ships at 70 minimum, 50 stretch — 55/35 if you are starting out.

- id: GATE-TIER-CONFIG-CHANGE
  label: Changing your daily volume cap
  class: reversible_internal
  pack: PACK-PREFERENCES
  owner: shared/tier-config.yaml
  rule: Rule 3
  default: "on"
  toggleable: false
  arm_required: false
  expires_days: null
  note: >
    The cap governs how many packages are PREPARED per day, never how many are
    sent — nothing sends itself. This cap continues to bind even when sending
    gates are switched off, and that is the point.
  panel:
    when_on: A change to how many applications get built per day is your decision.
