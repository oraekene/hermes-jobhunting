# ═════════════════════════════════════════════════════════════════════════════
# CLASS C — REVERSIBLE INTERNAL  (16 gates)
# ═════════════════════════════════════════════════════════════════════════════

- id: GATE-MEMORY-WRITE
  label: Storing a new fact about your career
  class: reversible_internal
  pack: PACK-MEMORY
  owner: 07-context-architect/SKILL.md
  rule: Rule 5
  default: "on"
  toggleable: true
  arm_required: false
  expires_days: null
  note: 07-context-architect is the only skill permitted to write here. Everything else reads.
  panel:
    when_on: >
      A story you tell in passing is read back to you before it is stored, so a
      detail you misremembered does not become the version used in every future
      application.
    when_off: >
      Facts are inferred and stored silently. A wrong figure propagates into
      resumes and interview answers until you notice it.

- id: GATE-STAR-WRITE
  label: Adding a story to your example bank
  class: reversible_internal
  pack: PACK-MEMORY
  owner: 07-context-architect/SKILL.md
  rule: Rule 5
  default: "on"
  toggleable: true
  arm_required: false
  expires_days: null
  panel:
    when_on: A story with an unresolved number is either given the number or explicitly marked as having none, before it is saved.
    when_off: Stories are written as told, gaps included. An interview answer later relies on a figure nobody checked.

- id: GATE-VOICE-NUMBER-ECHO
  label: Confirming numbers from voice notes
  class: reversible_internal
  pack: PACK-MEMORY
  owner: 07-context-architect/references/voice-interview-mode.md
  rule: Rule 5
  default: "on"
  toggleable: true
  arm_required: false
  expires_days: null
  panel:
    when_on: >
      You say "25% growth over six months" and it is read back as text before
      anything is written.
    when_off: >
      A transcription of "25" heard as "225" is stored as a fact and appears on
      your resume.

- id: GATE-FACT-CONFLICT
  label: Resolving contradictory facts
  class: reversible_internal
  pack: PACK-MEMORY
  owner: 07-context-architect/references/fact-conflict-resolution.md
  rule: Rule 5
  default: "on"
  toggleable: true
  arm_required: false
  expires_days: null
  panel:
    when_on: Two different team sizes for the same project are shown side by side and you say which is right.
    when_off: The newer one wins silently. Both versions may already have gone out to different employers.

- id: GATE-TARGET-PROFILE-WRITE
  label: Changing your target role and constraints
  class: reversible_internal
  pack: PACK-PREFERENCES
  owner: 07-context-architect/SKILL.md
  rule: Rule 5
  default: "on"
  toggleable: true
  arm_required: false
  expires_days: null
  covers: [seniority_band, locations, salary_floor, visa_sponsorship_required, title_variants, industries_exclude, companies_exclude]
  panel:
    when_on: A suggestion to widen your search to adjacent titles is proposed and you accept or decline it.
    when_off: The search target drifts on its own. You start seeing roles you would not have chosen.

- id: GATE-FIDELITY-MODE
  label: Changing how strictly claims must be evidenced
  class: reversible_internal
  pack: PACK-PREFERENCES
  owner: 09-risk-tactics-gate/SKILL.md
  rule: Rule 2
  default: "on"
  toggleable: false
  arm_required: true
  expires_days: null
  values: [strict, balanced, embellish]
  ships_as: strict
  note: >
    Not auto-toggleable — no skill may change this on its own, by rule. It moves
    only through an explicit confirmation, because it governs what your
    documents are allowed to claim happened.
  panel:
    when_on: >
      strict — every claim cites a specific line in your resume, portfolio or
      story bank. Where no evidence exists the tactic is dropped and the gap is
      flagged to you.
    when_off: >
      embellish — claims may be extended past what the evidence states. What
      goes out is something you may have to defend in an interview without
      anything on file behind it.

- id: GATE-OUTPUT-TEMPLATE-WRITE
  label: Saving a named output format
  class: reversible_internal
  pack: PACK-PREFERENCES
  owner: 21-output-templates/SKILL.md
  rule: Rule 11
  default: "on"
  toggleable: true
  arm_required: false
  expires_days: null
  note: The one confirmed-write file that does not route through 07-context-architect, deliberately — it is a formatting preference, not a career fact.
  panel:
    when_on: A structure you asked for once is confirmed before it becomes the default for that output type.
    when_off: Formats are saved as inferred. Later outputs follow a shape you never chose.

- id: GATE-PITCH-CONFIRM
  label: Confirming a service you can deliver
  class: reversible_internal
  pack: PACK-MEMORY
  owner: shared/pitch-catalog.md
  rule: null
  default: "on"
  toggleable: true
  arm_required: false
  expires_days: null
  panel:
    when_on: Each catalog entry is confirmed with its evidence before it can appear in a pitch.
    when_off: Entries are inferred from your history. A pitch offers something you would rather not have promised.

- id: GATE-PITCH-WILDCARD
  label: Confirming a stretch offer
  class: reversible_internal
  pack: PACK-MEMORY
  owner: shared/pitch-catalog.md
  rule: Rule 9
  default: "on"
  toggleable: false
  arm_required: false
  expires_days: null
  note: >
    Deliberately heavier and visibly distinct from the ordinary confirm flow —
