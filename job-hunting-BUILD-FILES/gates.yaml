- id: GATE-SKILL-EDIT
  label: Applying a change the tool proposes to itself
  class: reversible_internal
  pack: PACK-SELFEDIT
  owner: 11-analytics-and-learning/SKILL.md
  rule: null
  default: "on"
  toggleable: true
  arm_required: true
  expires_days: 90
  enforcement: {layers: 1, detail: [skills.write_approval — edits stage under ~/.hermes/pending/skills/ until approved]}
  note: >
    skills.write_approval is GLOBAL, not scoped to this package, and it does NOT
    gate archival — a separate path. Two controls, only one of which is a gate.
  panel:
    when_on: >
      "Values-alignment section shows no response-rate difference over 40
      applications — recommend making it optional." You read the proposed edit
      and the numbers behind it before it takes effect.
    when_off: >
      The tool rewrites its own instructions weekly on its own evidence. When
      output quality changes you will not know which edit did it.

- id: GATE-GEPA-DEPLOY
  label: Applying an optimiser-evolved skill
  class: reversible_internal
  pack: PACK-SELFEDIT
  owner: 11-analytics-and-learning/references/gepa-self-evolution.md
  rule: null
  default: "on"
  toggleable: false
  arm_required: false
  expires_days: null
  scope: [05-resume-customizer, 06-cover-letter, 08-application-qa]
  note: >
    Not toggleable, and 09-risk-tactics-gate is excluded from the feature
