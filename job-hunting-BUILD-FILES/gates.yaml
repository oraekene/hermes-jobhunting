- id: GATE-SKILL-COMPOSER-WRITE
  label: Adding a new capability to the tool
  class: reversible_internal
  pack: PACK-SELFEDIT
  owner: 18-skill-composer/SKILL.md
  rule: null
  default: "on"
  toggleable: false
  arm_required: false
  expires_days: null
  note: Defaults to writing an addendum rather than rewriting an existing file, so hand-tuned behaviour is never silently replaced.
  panel:
    when_on: A new capability is drafted and shown to you before it is installed.
    when_off: not available

- id: GATE-BACKUP-RESTORE
  label: Restoring from a backup
  class: reversible_internal
  pack: PACK-SYSTEM
  owner: security/backup-and-recovery.md
  rule: null
  default: "on"
  toggleable: false
  arm_required: false
  expires_days: null
  note: Restore overwrites current state. Backups themselves run unattended and need no gate.
  panel:
    when_on: A restore states what will be overwritten and from which date before it runs.
    when_off: not available

# ═════════════════════════════════════════════════════════════════════════════
# CLASS D — STRUCTURAL  (4)  not permissions, never toggleable, never in a pack
# ═════════════════════════════════════════════════════════════════════════════

- id: GATE-DM-PAIRING
  label: Who is allowed to approve
  class: structural
  pack: null
  owner: security/security-setup.md
  rule: Rule 1
  default: "on"
  toggleable: false
  note: >
    NON-NEGOTIABLE. Every approval in this registry means nothing if any account
    can send it. GATEWAY_ALLOW_ALL_USERS must never be true on a deployment of
    this package. Each customer needs their own paired identity — one pairing
    code per customer — so customer A can never see or approve customer B's
    staged applications.

- id: GATE-DANGEROUS-COMMAND
  label: Destructive command guard
  class: structural
  pack: PACK-SYSTEM
  owner: security/security-setup.md
  rule: null
  default: "on"
  toggleable: false
  note: >
    Hermes's own command-approval list plus dcg. Set dcg fail_closed = true on
    this deployment; its default is fail-open and this package's own hook fails
    closed. IMPORTANT INTERACTION: a container terminal backend causes Hermes to
    treat the container boundary as the security boundary and SKIP
    dangerous-command approval inside it. That protects the host machine and
    does nothing to stop an unreviewed application being submitted.

- id: GATE-INSTALL-INTEGRITY
  label: Install completeness check
  class: structural
  pack: PACK-SYSTEM
  owner: 00-orchestrator/scripts/install-check.py
  rule: Rule 0
  default: "on"
  toggleable: false
  note: >
    shared/ sits outside every skill directory, so installing one skill brings
    none of the rules it declares it must follow. A partial install does not
    crash — it produces a skill that reads convincingly with no rules, no
    database and no profile behind it. Verified at first run of any session.

- id: GATE-PLATFORM-PREREQ
  label: Platform prerequisites before a send is even possible
  class: structural
  pack: null
  owner: shared/pipeline-rules-addendum.md
  rule: Rule 13
  default: "on"
  toggleable: false
  covers:
    - LinkedIn connection accepted before a DM to a stranger
    - Instagram/Facebook 24-hour window opened by the recipient
    - X follow-back state
    - posting still exists — re-verified before the approval message is built
  note: >
    Not a permission. Rule 1 governs whether a human approved sending; this
    governs whether sending is a real action yet. Approval cannot skip it and
    switching gates off does not remove it.
