# gates.yaml — Gate Registry
#
# The single source of truth for every point in the pipeline where execution
# stops for a human decision. Three surfaces render from this file and nothing
# else: the permission-pack UI, the flat expert toggle list, and the settings
# info panel (description + on/off worked example).
#
# Derived from: shared/pipeline-rules.md (Rules 0-5),
# shared/pipeline-rules-addendum.md (Rules 6-16), security/security-setup.md,
# security/hooks/*.py, and every confirm-point in the 25 skill files.
#
# FIELD CONTRACT
#   id            stable, never reused, never renamed (packs and telemetry key on it)
#   class         irreversible_external | reversible_external | reversible_internal | structural
#   pack          which permission pack this belongs to
#   owner         the file that implements the gate
#   rule          the pipeline rule it enforces, if any
#   default       on | off  (on = gate active = user is asked)
#   toggleable    true | false
#   arm_required  true  -> typed confirmation phrase, not a tap, to switch OFF
#   expires_days  auto-approval lapses after N days and must be re-armed
#   cap_applies   the daily volume cap still binds even with the gate off
#   enforcement   how many independent layers back it
#   panel.when_on  worked example of what happens with the gate ON
#   panel.when_off worked example of what happens with the gate OFF
#
# CLASS DEFINITIONS
#   irreversible_external  a real thing happens to a third party and cannot be undone
#   reversible_external    touches the outside world but is undoable or low-stakes
#   reversible_internal    writes to the user's own files, memory, config or database
#   structural             a mechanical prerequisite, not a permission — never toggleable

meta:
  version: 1
  generated_from: 171 shipped files
  gate_count: 38
  policy:
    # Two gates can never be switched off by anyone. Not a trust judgement —
    # these are the two whose failure mode lands on someone who never agreed
    # to use this product.
    non_negotiable: [GATE-DM-PAIRING, GATE-SENSITIVE-DISCLOSURE]
    # Turning any irreversible_external gate off requires all of:
    irreversible_off_requires:
      - typed confirmation phrase
      - own screen, never bundled in a pack toggle
      - expiry and re-arm
      - daily cap still enforced
      - entry written to the audit log
    integrity:
      # The policy file is read by the submit hook. If the agent can write it,
      # a prompt injection in a scraped posting can open every gate at once.
      policy_path: "~/.hermes/job-hunting-policy.yaml   # OUTSIDE the agent working dir"
      checksum_at_session_start: true
      refuse_on_mid_session_change: true

# ─────────────────────────────────────────────────────────────────────────────
packs:
  - id: PACK-SENDING
    label: Sending and submitting
    blurb: Anything that reaches an employer, a recruiter or a stranger.
    class_hint: irreversible_external
  - id: PACK-PUBLISHING
    label: Publishing under your name
    blurb: Public pages, profile edits, comments and posts.
    class_hint: irreversible_external
  - id: PACK-SPENDING
    label: Spending money and credits
    blurb: Paid lookups and metered platform credits.
    class_hint: irreversible_external
  - id: PACK-MEMORY
    label: Writing to your memory
    blurb: Facts about your career, before they are stored.
    class_hint: reversible_internal
  - id: PACK-PREFERENCES
    label: Changing how the tool works
    blurb: Targets, templates, volume caps, schedules.
    class_hint: reversible_internal
  - id: PACK-SELFEDIT
    label: The tool changing itself
    blurb: Skill edits proposed by the learning loop.
    class_hint: reversible_internal
  - id: PACK-RESEARCH
    label: Reading the outside world
    blurb: Fetching pages, scanning your inbox, looking up contacts.
    class_hint: reversible_external
  - id: PACK-SYSTEM
    label: System safety
    blurb: Command guards, backups, install integrity.
    class_hint: reversible_internal

